<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="/lib.Semantic-UI-CSS-master/semantic.css">
    <script src="/lib/jquery-3.3.1.min.js"></script>
    <script src="/lib.Semantic-UI-CSS-master/semantic.js"></script>
</head>
<body>

<div class="ui container">
    <h2 class="ui header">Login</h2>

    <form class="ui form" id="loginForm">
        <div class="field">
            <label>Email</label>
            <input type="email" name="mail" placeholder="Email" required>
        </div>
        <div class="field">
            <label>Password</label>
            <input type="password" name="password" placeholder="Password" required>
        </div>
        <button class="ui blue button" type="submit">Login</button>
    </form>

    <div id="error" class="ui red message hidden"></div>
</div>

<script>
    $("#loginForm").submit(function(e) {
        e.preventDefault();
        const data = {
            mail: this.mail.value,
            password: this.password.value
        };

        fetch("http://localhost:8088/users/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        })
            .then(res => {
                if (!res.ok) throw new Error("Login failed");
                return res.json();
            })
            .then(user => {
                localStorage.setItem("user", JSON.stringify(user));
                window.location.href = "cardList.html";
            })
            .catch(err => {
                console.error(err);
                $("#error").text("Email ou mot de passe invalide").removeClass("hidden");
            });
    });
</script>

</body>
</html>
